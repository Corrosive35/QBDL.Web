name: recover-secrets

on:
  workflow_dispatch:
    inputs:
      age_pubkey:
        description: "Clé publique..."
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Installer age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Chiffrer les secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          AGE_PUBKEY: ${{ inputs.age_pubkey }}
        run: |
          set -euo pipefail
          case "$AGE_PUBKEY" in age1*) ;; *) echo "Clé publique age invalide"; exit 1;; esac
          printf '%s' "$SECRETS_JSON" | age -r "$AGE_PUBKEY" -o secrets.json.age
          ls -l secrets.json.age

      - name: Publier l'archive chiffrée
        uses: actions/upload-artifact@v4
        with:
          name: secrets-chiffres
          path: secrets.json.age
          retention-days: 1
