# Publication de l'image Docker.
#
# Pousser un tag « v<Version> » (par exemple v1.8.0) construit l'image sur les serveurs de GitHub,
# pour amd64 et arm64 comme les versions précédentes, et la publie sur Docker Hub sous deux tags :
# la version et « latest ». Rien ne se construit en local.
#
# Lancement manuel (onglet Actions → « Docker image » → « Run workflow ») : même construction,
# mais rien n'est publié. Utile pour vérifier qu'une branche compile avant de poser le tag.
#
# Livrer une version : <Version> dans QBDL.Web.csproj et section du CHANGELOG, commit, puis
#   git tag -a v1.8.0 -m "QBDL.Web 1.8.0" && git push origin main v1.8.0
#
# Secret attendu (Settings → Secrets and variables → Actions) : DOCKERHUB_TOKEN, jeton d'accès
# personnel Docker Hub (Account settings → Personal access tokens) en lecture-écriture.

name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Deux pushs du même tag ne doivent pas publier en même temps.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  # Dépôt Docker Hub d'origine, conservé lors du renommage du projet : les installations
  # existantes continuent de tirer la même image.
  IMAGE: thimble9057/qobuzdlx.web
  DOCKERHUB_USER: thimble9057

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Un tag qui ne correspond pas à <Version> publierait une image « 1.8.0 » qui s'annonce 1.7.0
      # dans /healthz et dans l'interface : on refuse avant même de construire.
      - name: Version
        id: version
        run: |
          version=$(sed -nE 's|.*<Version>([^<]+)</Version>.*|\1|p' QBDL.Web.csproj)
          if [ -z "$version" ]; then
            echo "::error::<Version> introuvable dans QBDL.Web.csproj."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à <Version>$version</Version> (QBDL.Web.csproj). Attendu : v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pour arm64, seule l'étape « apk add » de l'image finale tourne sous émulation : le SDK .NET
      # compile nativement sur le runner (voir le Dockerfile).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Connexion à Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction et publication
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
